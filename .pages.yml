media:
  input: public/content_imgs
  output: /blog-media
  extensions: [png, jpg, jpeg, webp, gif, avif]
  rename: safe

content:
  - name: blog
    label: 博客文章
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, date, draft, tags]
      sort: date
      order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 摘要
        type: text
        required: true
      - name: date
        label: 发布日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: 更新日期
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: tags
        label: 标签
        type: string
        list: true
      - name: category
        label: 分类
        type: string
      - name: image
        label: 封面图片
        type: image
      - name: imageAlt
        label: 封面图片描述
        type: string
      - name: draft
        label: 草稿
        type: boolean
        default: true
        description: 开启时仅保存草稿；关闭后保存，文章会在短缓存更新后公开展示。
      - name: body
        label: 正文
        type: rich-text
        required: true
        options:
          format: markdown

  - name: ielts-speaking
    label: IELTS-Speaking 口语答案
    type: collection
    path: tiku-answer/2026-sep-dec
    format: json
    filename: "{primary}.json"
    subfolders: false
    operations:
      create: false
      rename: false
      delete: false
    view:
      primary: title
      fields: [title, part, category]
      search: [title]
      sort: [title, part, order]
      default:
        sort: title
        order: asc
    fields:
      - name: id
        type: string
        hidden: true
      - name: title
        label: 话题
        type: string
        readonly: true
      - name: part
        label: Part
        type: string
        readonly: true
      - name: category
        label: 分类
        type: string
        readonly: true
      - name: order
        type: number
        hidden: true
      - name: sections
        label: 分组
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{fields.id}"
        fields:
          - name: id
            type: string
            hidden: true
          - name: label
            label: 分组名称
            type: string
            readonly: true
          - name: questions
            label: 题目
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.prompt}"
            fields:
              - name: id
                type: string
                hidden: true
              - name: prompt
                label: 原题
                type: text
                readonly: true
              - name: variant
                type: string
                hidden: true
              - name: cuePoints
                label: 题卡提示
                type: string
                list: true
                readonly: true
              - name: answers
                label: 英文答案
                type: object
                required: true
                fields:
                  - name: basic
                    label: 基础版
                    type: text
                    required: true
                  - name: upgraded
                    label: 升级版
                    type: text
